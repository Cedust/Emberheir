name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run deps
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run balance -- --runs 100

  e2e:
    # Chromium renders the Pixi scenes in software on CI, so the tests are bound by CPU: more
    # workers on one runner only slow each test down, but more runners add cores. Four runners
    # take a balanced share each: the six slow "every main view" walks (@screens) in two
    # halves, the rest in two halves.
    name: Playwright (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: screens 1/2
            args: --grep @screens --shard 1/2
          - part: screens 2/2
            args: --grep @screens --shard 2/2
          - part: rest 1/2
            args: --grep-invert @screens --shard 1/2
          - part: rest 2/2
            args: --grep-invert @screens --shard 2/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -- ${{ matrix.args }}
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/web/playwright-report
          retention-days: 7

  # One stable check name for all four parts, so branch protection can require "Playwright".
  e2e-result:
    name: Playwright
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e.result }}" = success
