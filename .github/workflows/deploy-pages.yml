name: Deploy preview

# main is published to the root of the gh-pages branch; PR previews live next to it in
# pr-preview/pr-<n>/ (see pr-preview.yml). GitHub Pages serves the gh-pages branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: touch apps/web/dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: apps/web/dist
          clean-exclude: pr-preview/
          force: false
          commit-message: "chore: deploy main ${{ github.sha }}"
